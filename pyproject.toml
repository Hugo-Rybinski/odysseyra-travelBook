[project]
name = "odysseyra-travelbook"
version = "0.1.0"
description = "Generate a beautiful travel PDF from a JSON itinerary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hugo Rybinski", email = "hugo.rybinski@algolia.com" }]
dependencies = [
    "fpdf2>=2.7",
    "Pillow>=9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
odysseyra-travelBook = "odysseyra_travelbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odysseyra_travelbook"]
artifacts = ["src/odysseyra_travelbook/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
